name: ALIGN CI Pipeline

on:
  push:
    branches: [ main, master, feature/** ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test Suite (FastAPI + pgvector + Neo4j)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: align
          POSTGRES_PASSWORD: align_password
          POSTGRES_DB: align_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/align_neo4j_password
        ports:
          - 7687:7687
          - 7474:7474

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio pytest-cov httpx

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql+psycopg://align:align_password@localhost:5432/align_db
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: align_neo4j_password
          JWT_SECRET_KEY: test_secret_key_for_ci_pipeline_only_32_chars_min
          LOG_LEVEL: INFO
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          pytest backend/tests -v --maxfail=1

  frontend-build:
    name: Frontend Quality & Build (React + TypeScript + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Run Frontend Tests (Vitest)
        run: npm --prefix frontend test

      - name: Compile and Build Frontend
        run: npm --prefix frontend run build
